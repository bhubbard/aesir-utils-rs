[package]
name = "aesir-utils-rs"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard"]
description = "Pure Rust screen safezone, aspect ratio correction, and UI anchor positioning engine from FiveM aesir_utils"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/aesir-utils-rs"
homepage = "https://bhubbard.github.io/aesir-utils-rs/"
readme = "README.md"
keywords = ["fivem", "safezone", "ui", "aspect-ratio", "gamedev"]
categories = ["game-development", "gui", "math"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
